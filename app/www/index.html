<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office CCTV</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #07080a;
    --line: #1b1d21;
    --text: #f5f5f7;
    --muted: #7c7c83;
    --live: #30d158;
    --ease: cubic-bezier(.22,1,.36,1);
    --bar: 44px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); height: 100%; overflow: hidden; }
  body {
    color: var(--text);
    font: 13px/1.4 -apple-system, "SF Pro Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }

  header {
    height: var(--bar); flex: none;
    display: flex; align-items: center; gap: 12px; padding: 0 14px;
    background: rgba(18,18,20,.9);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .summary { color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 3px rgba(48,209,88,.15); }
  .spacer { flex: 1; }
  #clock { color: var(--muted); font-variant-numeric: tabular-nums; }
  .btn {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 500; color: var(--text);
    background: rgba(255,255,255,.09); padding: 5px 12px; border-radius: 999px;
    transition: background .2s var(--ease), transform .2s var(--ease);
  }
  .btn:hover { background: rgba(255,255,255,.16); }
  .btn:active { transform: scale(.96); }

  /* Camera wall: working cameras first, the rest fill the last slots */
  main { flex: 1; min-height: 0; padding: 0; }
  #grid {
    height: 100%; display: grid; gap: 2px; background: var(--line);
    grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
    grid-template-rows: repeat(var(--rows, 4), minmax(0, 1fr));
  }
  .tile { position: relative; overflow: hidden; background: #000; cursor: pointer; min-height: 0; }
  .tile .cam { position: absolute; inset: 0; display: block; }
  .tile video { width: 100%; height: 100%; object-fit: cover; background: #000; display: block; opacity: 0; transition: opacity .5s var(--ease); }
  .tile[data-state="live"] video { opacity: 1; }

  .label {
    position: absolute; left: 10px; top: 10px;
    padding: 2px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 500; text-transform: capitalize; letter-spacing: .01em;
    background: rgba(0,0,0,.5);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    pointer-events: none; display: flex; align-items: center; gap: 6px;
    z-index: 2;
  }
  .label i { width: 5px; height: 5px; border-radius: 50%; background: #555; }
  .tile[data-state="live"] .label i { background: var(--live); }

  .tile[data-state="connecting"]::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.04) 50%, transparent 70%);
    background-size: 200% 100%; animation: shimmer 1.6s linear infinite;
  }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  /* Not working: calm slate panel, optional last-seen snapshot */
  .tile[data-state="offline"] { background: #14161a; cursor: default; }
  .snap {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    filter: grayscale(1) brightness(.7); opacity: .4; display: none;
  }
  .tile[data-state="offline"].has-snap .snap { display: block; }
  .off {
    position: absolute; inset: 0; z-index: 1; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    color: #3a3d44; pointer-events: none;
  }
  .off svg { width: 22%; max-width: 110px; min-width: 40px; height: auto; }
  .off span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .off small { font-size: 11px; color: #6c6f77; letter-spacing: 0; text-transform: none; min-height: 1em; }
  .tile[data-state="offline"] .off { display: flex; }
  .tile[data-state="offline"].has-snap .off { justify-content: flex-end; padding-bottom: 14px; color: #c5c7cc; }
  .tile[data-state="offline"].has-snap .off svg { display: none; }
  .tile[data-state="offline"].has-snap .off small { color: #a9acb3; }

  .tile.fmt .off span { color: #b8935a; }
  .tile.fmt .off small { color: #8d8f96; }
  .tile.expanded { position: fixed; inset: 0; z-index: 20; cursor: zoom-out; animation: pop .3s var(--ease); }
  .tile.expanded video { object-fit: contain; }
  .tile.expanded .label { left: 16px; top: 16px; font-size: 13px; }
  @keyframes pop { from { opacity: .5; transform: scale(.98); } to { opacity: 1; transform: none; } }

  #grid.only-live .tile[data-state="offline"] { display: none; }
  main { position: relative; }
  #notice {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 25;
    max-width: 520px; padding: 18px 22px; border-radius: 16px; text-align: center;
    background: rgba(20,21,24,.86); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; gap: 6px;
  }
  #notice[hidden] { display: none; }
  #notice b { font-size: 15px; font-weight: 600; }
  #notice span { color: var(--muted); }
  #empty { grid-column: 1 / -1; align-self: center; text-align: center; color: var(--muted); background: var(--bg); }

  /* Wall mode (?wall): for a dedicated screen. Top bar and cursor appear only while the mouse moves. */
  /* The top bar slides in over the cameras when the mouse moves, and hides again after 3 s */
  body.wall header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    transform: translateY(-100%); opacity: 0;
    transition: transform .35s var(--ease), opacity .35s var(--ease);
  }
  body.wall:not(.idle) header { transform: none; opacity: 1; }
  body.wall.idle, body.wall.idle * { cursor: none !important; }

  @media (max-width: 700px) { #clock { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Office CCTV</h1>
  <div class="summary"><span class="dot"></span><span id="summary">Connecting…</span></div>
  <div class="spacer"></div>
  <span id="clock"></span>
  <button class="btn" id="view" title="Show only working cameras, or all channels (key: W)">All 16</button>
  <button class="btn" id="quality" title="Switch between full quality and light streams">HD</button>
  <button class="btn" id="reload">Reload</button>
</header>
<main><div id="grid"></div><div id="notice" hidden></div></main>

<script type="module">
import { VideoRTC } from './video-rtc.js';

/* Minimal player: no overlay text, state is reported by the page. */
class Cam extends VideoRTC {
  oninit() {
    super.oninit();
    const v = this.video;
    v.muted = true; v.autoplay = true; v.playsInline = true; v.controls = false;
    this.appendChild(v);
  }
  /* Switch to another stream, or stop (url empty). VideoRTC ignores a new src while connected, so close first. */
  setSource(url) {
    if (this.reconnectTID) { clearTimeout(this.reconnectTID); this.reconnectTID = 0; }
    this.ondisconnect();
    this.wsURL = '';
    if (url) this.src = url;
  }
}
customElements.define('cam-player', Cam);

const WALL = new URLSearchParams(location.search).has('wall');
if (WALL) document.body.classList.add('wall');

const grid = document.getElementById('grid');
const summary = document.getElementById('summary');
const OFFLINE_AFTER = 12000;   // light stream
const HD_START_TIMEOUT = 25000; // full-quality stream (10 at once can be slow to start)
const SNAP_EVERY = 15000;
const STORE = 'cctv-last-seen';
let tiles = [];

/* Last-seen snapshots, kept in this browser */
let snaps = {};
try { snaps = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { snaps = {}; }
const saveSnaps = () => { try { localStorage.setItem(STORE, JSON.stringify(snaps)); } catch (e) {} };

const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6H14a3 3 0 013 3v1.4l4-2.4v8"/><path d="M15 17H6a3 3 0 01-3-3V9a3 3 0 011.5-2.6"/></svg>';
const pretty = n => n.replace(/[_-]/g, ' ');

function seenText(ts) {
  const d = new Date(ts), now = new Date();
  const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return d.toDateString() === now.toDateString() ? `Last seen ${time}` : `Last seen ${d.toLocaleDateString([], { month: 'short', day: 'numeric' })}, ${time}`;
}

function showSnap(t) {
  const s = snaps[t.name];
  t.el.classList.toggle('has-snap', !!s);
  if (t.fmt) { t.el.classList.remove('has-snap'); t.seen.textContent = 'Set this camera to H.264 in the recorder'; return; }
  if (s) { t.snap.src = s.img; t.seen.textContent = seenText(s.ts); }
  else t.seen.textContent = '';
}

function capture(t) {
  const v = t.player && t.player.video;
  if (!v || t.el.dataset.state !== 'live' || !v.videoWidth) return;
  try {
    const c = document.createElement('canvas');
    c.width = 320; c.height = Math.round(320 * v.videoHeight / v.videoWidth);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    snaps[t.name] = { img: c.toDataURL('image/jpeg', .6), ts: Date.now() };
    saveSnaps();
  } catch (e) {}
}

/* Close a player for good without the media-error noise of resetting its video */
function kill(p) {
  if (p.reconnectTID) { clearTimeout(p.reconnectTID); p.reconnectTID = 0; }
  p.wsState = WebSocket.CLOSED; p.pcState = WebSocket.CLOSED;
  if (p.ws) { try { p.ws.close(); } catch (e) {} p.ws = null; }
  if (p.pc) { try { p.pc.close(); } catch (e) {} p.pc = null; }
  if (p.video) { p.video.onerror = null; p.video.pause(); }   // detached element is freed by the browser
  p.remove();
}

/* Working cameras first (in number order); cameras with no signal fill the last slots. */
function update() {
  const live = tiles.filter(t => t.el.dataset.state === 'live').length;
  const off = tiles.filter(t => t.el.dataset.state === 'offline').length;
  tiles.forEach((t, i) => { t.el.style.order = (t.el.dataset.state === 'offline' ? 1000 : 0) + i; });
  const shown = onlyLive ? Math.max(1, tiles.length - off) : tiles.length;
  const cols = onlyLive ? Math.min(4, Math.ceil(Math.sqrt(shown))) : Math.min(4, shown);
  grid.style.setProperty('--cols', Math.max(1, cols));
  grid.style.setProperty('--rows', Math.max(1, Math.ceil(shown / Math.max(1, cols))));
  showView();
  const pending = tiles.length - live - off;
  summary.textContent = pending && !live && !off ? 'Connecting…' : `${live} live` + (off ? ` · ${off} offline` : '');
}

function setState(t, s) {
  if (s === 'live') t.fmt = false;
  const reason = t.el.querySelector('.off span');
  if (reason) reason.textContent = t.fmt ? 'Video format not supported' : 'No signal';
  t.el.classList.toggle('fmt', !!t.fmt);
  if (t.el.dataset.state === s) return;
  t.el.dataset.state = s;
  if (s === 'offline') showSnap(t);
  update();
}

/* Quality: "HD" uses the recorder's main streams (name_hd) when available, "Fast" uses the light sub streams. */
let hdOn = true;
try { hdOn = localStorage.getItem('cctv-hd') !== '0'; } catch (e) {}
/* On a PC that cannot decode every full-quality stream at once, the grid switches itself to the light streams
   (smooth) and a camera you open gets its full-quality stream. HD button clears this and tries again. */
let autoFast = false;
try { localStorage.removeItem('cctv-auto'); } catch (e) {}   // older versions saved this forever
/* Small screens (about 1366 wide or less): each tile is only ~340 px wide, so a 1440p picture shrunk that far turns
   grainy. Use the light streams in the grid there, and the full-quality stream when a camera is opened. */
const smallScreen = innerWidth * (devicePixelRatio || 1) < 1500;
if (smallScreen) autoFast = true;
const qualityBtn = document.getElementById('quality');
const showQuality = () => { qualityBtn.textContent = hdOn ? (autoFast ? 'Auto' : 'HD') : 'Fast'; };
showQuality();

function build(all) {
  tiles.forEach(t => { clearTimeout(t.timer); clearTimeout(t.snapStart); clearInterval(t.snapTimer); t.stop && t.stop(); });
  grid.innerHTML = '';
  tiles = [];
  const hdNames = new Set(all.filter(n => n.endsWith('_hd')));
  const names = all.filter(n => !n.endsWith('_hd'));
  qualityBtn.hidden = hdNames.size === 0;
  names.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  if (!names.length) { grid.innerHTML = '<div id="empty">No cameras configured.</div>'; summary.textContent = 'No cameras'; return; }

  names.forEach(name => {
    const el = document.createElement('div');
    el.className = 'tile';
    el.dataset.state = 'connecting';
    el.innerHTML = `<img class="snap" alt=""><div class="off">${ICON}<span>No signal</span><small></small></div><div class="label"><i></i>${pretty(name)}</div>`;

    const t = { name, el, player: null, snap: el.querySelector('.snap'), seen: el.querySelector('.off small'), timer: 0, snapTimer: 0, snapStart: 0 };
    const hasHd = hdNames.has(name + '_hd');
    let useHd = hdOn && hasHd && !autoFast;   // t.hdBadFmt: main stream is in a format this browser cannot show
    const source = () => new URL('api/ws?src=' + encodeURIComponent(useHd ? name + '_hd' : name), location.href);
    t.hasHd = hasHd;
    t.lastT = 0; t.lastMove = Date.now();
    const live = () => {
      clearTimeout(t.timer); setState(t, 'live');
      if (t.hdTried && !useHd) t.hdFail = Date.now();   // HD failed but the light stream works: HD itself is the problem
      t.hdTried = false;
      // came back on the light stream (retry after a power cut): move up to full quality unless HD failed recently
      t.fmtTried = false;
      if (!useHd && hasHd && hdOn && !autoFast && !t.hdBadFmt && Date.now() - (t.hdFail || 0) > 10 * 60 * 1000) {
        clearTimeout(t.upTimer); t.upTimer = setTimeout(() => { if (el.dataset.state === 'live') t.setHd(true); }, 4000);
      }
    };

    /* Every connect gets a brand-new player. Reusing one let the old socket's late "closed" event
       knock out the new connection, which left cameras stuck on "connecting" or double-fed. */
    const mount = (url) => {
      const old = t.player;
      if (old) kill(old);
      const p = document.createElement('cam-player');
      p.className = 'cam';
      p.mode = 'mse';   // reliable TCP delivery: no blocky/smeared frames from dropped packets
      el.prepend(p);    // el is already on the page, so this creates p.video
      t.player = p;
      t.lastT = 0; t.lastMove = Date.now();
      const v = p.video;
      /* Only a real picture counts as live. A stream that plays but has no picture (only sound) means
         the browser cannot decode the camera's video format, usually H.265. */
      clearTimeout(t.noVidTimer); t.noVidTimer = 0;
      const check = () => {
        if (t.player !== p) return;
        if (v.videoWidth > 0) { clearTimeout(t.noVidTimer); t.noVidTimer = 0; if (el.dataset.state !== 'live') { live(); setTimeout(() => capture(t), 2500); } }
        else if (!t.noVidTimer) t.noVidTimer = setTimeout(() => { if (t.player === p && !v.videoWidth) noPicture(); }, 6000);
      };
      v.addEventListener('playing', () => { if (v.currentTime > 0) check(); });
      v.addEventListener('timeupdate', () => {
        if (t.player !== p) return;
        const ct = v.currentTime;
        if (ct !== t.lastT) { t.lastT = ct; t.lastMove = Date.now(); }
        if (ct > 0) check();
      });
      if (url) p.src = url;
    };
    /* Connected, but no picture: try the other stream (main/sub can use different formats), then explain on the tile */
    const noPicture = () => {
      if (hasHd && !t.fmtTried) { t.fmtTried = true; if (useHd) t.hdBadFmt = true; useHd = !useHd; mount(source()); arm(); return; }
      t.fmt = true; t.fmtTried = false;
      setState(t, 'offline'); t.stop();
    };
    t.stop = () => { if (t.player) { kill(t.player); t.player = null; } };

    const arm = () => {
      clearTimeout(t.timer);
      t.timer = setTimeout(() => {
        if (el.dataset.state === 'live') return;
        if (useHd) { useHd = false; t.hdTried = true; mount(source()); arm(); }   // HD didn't start: fall back to the light stream
        else { t.hdTried = false; setState(t, 'offline'); t.stop(); }               // stop until the next retry
      }, useHd ? HD_START_TIMEOUT : OFFLINE_AFTER);
    };
    /* Reconnect from scratch (after a power cut the recorder and cameras come back minutes later) */
    t.retry = (light) => { useHd = !light && hdOn && hasHd && !t.hdBadFmt && !(autoFast && !el.classList.contains('expanded')); mount(source()); arm(); };
    t.setHd = v => { if (!hasHd || useHd === v || (v && t.hdBadFmt)) return; useHd = v; if (el.dataset.state === 'live') setState(t, 'connecting'); mount(source()); arm(); };

    grid.appendChild(el);
    t.snapStart = setTimeout(() => { t.snapTimer = setInterval(() => capture(t), SNAP_EVERY); }, Math.random() * SNAP_EVERY);
    mount(source());
    arm();

    el.addEventListener('click', () => {
      if (el.dataset.state !== 'live') return;
      const open = el.classList.toggle('expanded');
      if (autoFast && hdOn) t.setHd(open);   // slow PC: grid uses light streams, the opened camera gets full quality
    });
    tiles.push(t);
  });
  update();
}

/* Big message on the wall itself (the top bar is hidden on the TV) */
const notice = document.getElementById('notice');
const say = (title, text) => { notice.hidden = !title; if (title) notice.innerHTML = `<b>${title}</b><span>${text}</span>`; };

let loadTimer = 0;
function load() {
  clearTimeout(loadTimer);
  fetch('api/streams', { cache: 'no-store' }).then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(o => { say(''); build(Object.keys(o)); })
    .catch(() => {
      summary.textContent = 'Viewer engine not running';
      say('Starting the viewer…', 'The streaming engine (go2rtc) is not answering yet. Retrying every 5 seconds.');
      loadTimer = setTimeout(load, 5000);   // the wall may open before go2rtc is ready
    });
}

/* Nothing at all has connected for a while: most likely the recorder is off, rebooting, or has a new IP */
setInterval(() => {
  if (!tiles.length || !notice.hidden && notice.dataset.kind !== 'rec') return;
  const anyLive = tiles.some(t => t.el.dataset.state === 'live');
  const allOff = tiles.every(t => t.el.dataset.state === 'offline');
  if (allOff && !anyLive) { notice.dataset.kind = 'rec'; say('Cannot reach the recorder', 'Check that this PC is on the office network and the recorder is on. After a power cut it can take 2–3 minutes. Cameras reconnect by themselves.'); }
  else if (notice.dataset.kind === 'rec') { notice.dataset.kind = ''; say(''); }
}, 5000);

document.getElementById('reload').onclick = load;
qualityBtn.onclick = () => {
  hdOn = !hdOn;
  autoFast = false;
  try { localStorage.setItem('cctv-hd', hdOn ? '1' : '0'); } catch (e) {}
  showQuality();
  load();
};
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  document.querySelectorAll('.tile.expanded').forEach(el => {
    el.classList.remove('expanded');
    const t = tiles.find(x => x.el === el); if (t && autoFast && hdOn) t.setHd(false);
  });
});

/* Watch playback: if full-quality tiles keep dropping frames, move the grid to the light streams */
let prevQ = new Map(), bad = 0;
setInterval(() => {
  if (autoFast || !hdOn) { prevQ = new Map(); return; }
  let total = 0, dropped = 0;
  tiles.forEach(t => {
    if (t.el.dataset.state !== 'live' || !t.hasHd || t.el.classList.contains('expanded') || !t.player || t.player.video.paused) return;
    const q = t.player.video.getVideoPlaybackQuality && t.player.video.getVideoPlaybackQuality();
    if (!q) return;
    const p = prevQ.get(t);
    if (p && q.totalVideoFrames >= p.total) { total += q.totalVideoFrames - p.total; dropped += q.droppedVideoFrames - p.dropped; }
    prevQ.set(t, { total: q.totalVideoFrames, dropped: q.droppedVideoFrames });
  });
  if (total < 100) return;
  bad = dropped / total > 0.06 ? bad + 1 : 0;
  if (bad >= 3) {   // about 15 seconds of trouble in a row
    autoFast = true; bad = 0; prevQ = new Map();
    showQuality();
    setTimeout(() => { if (smallScreen) return; autoFast = false; showQuality(); tiles.forEach(t => t.setHd(true)); }, 30 * 60 * 1000);   // try full quality again later
    tiles.forEach(t => { if (!t.el.classList.contains('expanded')) t.setHd(false); });
  }
}, 5000);

/* Every 10 s: a live camera whose picture has not moved for 15 s is reconnected;
   a camera showing NO SIGNAL is tried again every 30 s, so cameras come back by themselves after a power cut. */
setInterval(() => {
  const now = Date.now();
  tiles.forEach(t => {
    const st = t.el.dataset.state;
    if (st === 'live' && now - t.lastMove > 15000 && document.visibilityState === 'visible') { setState(t, 'connecting'); t.retry(); }
    else if (st === 'offline' && now - (t.lastTry || 0) > (t.fmt ? 120000 : 30000)) { t.lastTry = now; t.retry(!t.fmt); }
  });
}, 10000);

/* View: all channels (4x4) or only the working cameras, filling the screen */
let onlyLive = false;
try { onlyLive = localStorage.getItem('cctv-only-live') === '1'; } catch (e) {}
const viewBtn = document.getElementById('view');
const showView = () => { viewBtn.textContent = onlyLive ? 'Working only' : `All ${tiles.length || 16}`; grid.classList.toggle('only-live', onlyLive); };
viewBtn.onclick = () => { onlyLive = !onlyLive; try { localStorage.setItem('cctv-only-live', onlyLive ? '1' : '0'); } catch (e) {} showView(); update(); };
addEventListener('keydown', e => { if ((e.key === 'w' || e.key === 'W') && !e.ctrlKey && !e.metaKey) viewBtn.click(); });

const clock = document.getElementById('clock');
const tick = () => clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
tick(); setInterval(tick, 15000);

/* Keep the screen awake while the viewer is open */
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
keepAwake();
document.addEventListener('visibilitychange', keepAwake);

if (WALL) {
  /* Hide the mouse pointer after 3 seconds without movement */
  let idleTimer = 0;
  const bar = document.querySelector('header');
  let held = 0;
  const sleep = () => { if (bar.matches(':hover') && held++ < 6) idleTimer = setTimeout(sleep, 3000); else document.body.classList.add('idle'); };
  const wake = () => { held = 0; document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(sleep, 3000); };
  ['mousemove', 'mousedown', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, wake, { passive: true })); wake();
  /* Fresh start every 6 hours keeps a screen that runs for weeks healthy */
  setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
}

load();
</script>
</body>
